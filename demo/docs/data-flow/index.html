<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2UI Demo Data Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Reader first: the selected node fills a wide reading pane; the graph is a navigator beside it.
   With nothing selected the pane is an index of every node. Stacks on phones, reader on top. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1d2321; --muted: #5d6763; --line: #d9ddd8;
  --accent: #1f6f78; --accent-soft: #d7ebec; --dim: 0.12;
  --g1: #1f6f78; --g2: #b4532a; --g3: #6a4fa3; --g4: #3f7d3a; --g5: #a8761a; --g6: #b23a62; --g7: #4b6584; --g8: #7a7f2a;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121615; --surface: #1a1f1e; --ink: #e6ebe8; --muted: #9aa5a0; --line: #2c3432;
  --accent: #5fb7bf; --accent-soft: #1d3a3d; --dim: 0.14;
  --g1: #5fb7bf; --g2: #e08a60; --g3: #a993dd; --g4: #7fbf73; --g5: #d9ad55; --g6: #e47b9f; --g7: #8fa7c7; --g8: #b8bd5c;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121615; --surface: #1a1f1e; --ink: #e6ebe8; --muted: #9aa5a0; --line: #2c3432;
  --accent: #5fb7bf; --accent-soft: #1d3a3d; --dim: 0.14;
  --g1: #5fb7bf; --g2: #e08a60; --g3: #a993dd; --g4: #7fbf73; --g5: #d9ad55; --g6: #e47b9f; --g7: #8fa7c7; --g8: #b8bd5c;
  color-scheme: dark }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { display: flex; flex-direction: column; height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; margin-right: auto; }
h1 small { font-family: var(--font-mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-left: 8px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs button { font: 500 13px var(--font-body); color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { position: relative; }
.search input { font: 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 240px; max-width: 100%; }
.results { position: absolute; top: calc(100% + 4px); left: 0; width: min(380px, 90vw); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.14); padding: 4px; margin: 0; list-style: none; max-height: 60vh; overflow: auto; }
.results[hidden] { display: none; }
.results li { padding: 7px 9px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.results li[aria-selected="true"], .results li:hover { background: var(--accent-soft); }
.results li small { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); gap: 12px; }
.reader { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-y: auto; padding: 22px clamp(18px, 3vw, 40px) 28px; }
.side { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.stage { position: relative; flex: 1 1 55%; min-height: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#cy { position: absolute; inset: 0; }
.legend { position: absolute; top: 8px; left: 8px; right: 52px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 2; pointer-events: none; }
.legend > * { pointer-events: auto; }
.chip { font: 500 10.5px var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px 3px 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip i, .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="false"] i { background: transparent !important; outline: 1px solid var(--muted); }
.fit { position: absolute; right: 8px; top: 8px; z-index: 2; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 0 1 auto; max-height: 45%; }
.eyebrow { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
.walks { display: flex; flex-direction: column; gap: 6px; }
.walk { text-align: left; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.walk b { display: block; font-size: 13.5px; font-weight: 600; }
.walk span { display: block; font-size: 12.5px; color: var(--muted); }
.walk[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.btn { font: 500 12.5px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:disabled { opacity: 0.4; cursor: default; }
/* Reader */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 0 0 14px; }
.crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
.crumbs a:hover { text-decoration: underline; }
.walkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; margin: 0 0 16px; font-size: 13.5px; }
.walkbar b { margin-right: auto; }
.walkbar[hidden] { display: none; }
.node-title { font-size: clamp(22px, 2.4vw, 28px); line-height: 1.2; font-weight: 650; margin: 0 0 10px; letter-spacing: -0.015em; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.pill { font: 500 11.5px var(--font-mono); border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.pill.st-done { color: var(--ink); }
.pill.st-dashed { border-style: dashed; color: var(--ink); }
.detail { font-size: 17px; line-height: 1.62; max-width: 70ch; margin: 0 0 18px; white-space: pre-line; }
.payload { margin: 0 0 18px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 12.5px/1.5 var(--font-mono); white-space: pre-wrap; word-break: break-word; max-width: 90ch; }
.label-row { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
.srclist { list-style: none; padding: 0; margin: 0 0 22px; display: flex; flex-direction: column; gap: 4px; font: 13px var(--font-mono); word-break: break-word; }
.srclist a { color: var(--accent); display: inline-flex; flex-wrap: wrap; gap: 0 10px; }
.srclist .lines { color: var(--muted); }
.srclist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.srclist .origin { font: 500 11px var(--font-body); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; text-decoration: none; display: inline; }
.srclist a.origin:hover { color: var(--accent); border-color: var(--accent); }
.conn { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 24px; margin: 0 0 22px; }
.conn ul, .idx ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.conn li a, .idx li a { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; color: var(--ink); text-decoration: none; cursor: pointer; }
.conn li a:hover, .idx li a:hover { background: var(--accent-soft); }
.conn li a .dot { position: relative; top: 1px; }
.conn em { font-style: normal; font: 12px var(--font-mono); color: var(--muted); display: block; }
.conn .none { color: var(--muted); font-size: 13.5px; }
.sibnav { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.sibnav a { color: var(--accent); cursor: pointer; text-decoration: none; font-size: 14px; max-width: 48%; }
.sibnav a:hover { text-decoration: underline; }
.sibnav .next { text-align: right; margin-left: auto; }
.keys { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
kbd { font: 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
/* Index */
.summary { font-size: 16px; line-height: 1.6; max-width: 72ch; margin: 0 0 8px; }
.note { color: var(--muted); font-size: 13.5px; max-width: 72ch; margin: 0 0 20px; }
.idx h2 { font-size: 14px; margin: 22px 0 6px; display: flex; align-items: center; gap: 8px; }
.idx h2 small { color: var(--muted); font-weight: 400; }
.idx li a span.lbl { flex: 1; min-width: 0; }
.idx li a small { color: var(--muted); font: 11.5px var(--font-mono); white-space: nowrap; }
.idx .ord { color: var(--muted); font: 12px var(--font-mono); min-width: 2ch; text-align: right; }
@media (max-width: 900px) {
  html, body { height: auto; }
  .wrap { height: auto; }
  main { grid-template-columns: 1fr; }
  .reader { overflow: visible; }
  .stage { flex: none; height: 52vh; }
  section.card { max-height: none; }
  .search input { width: 180px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>A2UI demo: data flow <small>talk-a2ui · A2UI v0.9</small></h1>
    <div class="search">
      <input id="search" type="search" placeholder="Find a node…  ( / )" aria-label="Find a node" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>
  <main>
    <article class="reader" id="reader" aria-live="polite" tabindex="-1"></article>
    <div class="side">
      <div class="stage">
        <div class="legend" id="legend"></div>
        <div id="cy" role="img" aria-label="Graph of the nodes; the reading pane lists the same nodes and their connections"></div>
        <button class="btn fit" id="fit" type="button" title="Fit the whole graph">Fit</button>
      </div>
      <section class="card" id="walkcard">
        <p class="eyebrow">Guided walks</p>
        <div class="walks" id="walks"></div>
      </section>
    </div>
  </main>
</div>

src/app/agent/agent-client.ts", "lines": "117–122", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L117-L122", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "e-a2a-out", "label": "3 A2A message/stream", "group": "server", "order": 3, "detail": "The server wraps the request in one A2A message (text part, or data part { version, action | error }), sets contextId = sessionId and metadata.a2uiClientCapabilities with the ticket catalog id, and calls the agent over JSON-RPC.", "source": "demo/apps/client/src/server.ts", "status": "done", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "138–147", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L138-L147", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "e-negotiate", "label": "4 Negotiate + read", "group": "agent", "order": 4, "detail": "pickA2ui picks v0.9 and the ticket catalog from the metadata, and the agent logs what it received (\"--- capabilities: … ---\", stage 1: the browser never sends them, the app's server adds them); readInboundMessage gets text, action or client error; the system prompt is built from that catalog's toJson() and examples.", "source": "demo/apps/agent/src/turn/agent.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/agent.ts", "lines": "115–124", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/agent.ts#L115-L124", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/9d2ec29ca1/samples/agent/node/restaurant_finder/src/agent.ts"}]}, {"id": "e-query", "label": "5 Build the query", "group": "agent", "order": 5, "detail": "Text as is; open_ticket prefetches the ticket; a VALIDATION_FAILED redoes the last turn with the error first (once).", "source": "demo/apps/agent/src/turn/user-query.ts · demo/apps/agent/src/turn/client-retry.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/user-query.ts", "lines": "37–62", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/user-query.ts#L37-L62", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/user-query.ts"}, {"path": "demo/apps/agent/src/turn/client-retry.ts", "lines": "43–61", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/client-retry.ts#L43-L61", "origin": "demo"}]}, {"id": "e-model", "label": "6 Model writes A2UI", "group": "llm", "order": 6, "detail": "Live: Gemini call 1 asks for get_tickets, the agent runs it (data/tickets.json, internal_notes included), call 2 streams A2UI v0.9 JSON in <a2ui-json> blocks. Each call times out after 30 s (GEMINI_CALL_TIMEOUT_MS), at most 3 tool rounds; a turn that doesn't finish drops its chat. Stub: a canned reply in chunks.", "source": "demo/apps/agent/src/model/model.ts · demo/apps/agent/src/model/tools.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/model/model.ts", "lines": "88–169", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/model/model.ts#L88-L169", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/model.ts"}, {"path": "demo/apps/agent/src/model/tools.ts", "lines": "90–118", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/model/tools.ts#L90-L118", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/tools.ts"}]}, {"id": "e-validate", "label": "7 Validate as it streams", "group": "agent", "order": 7, "detail": "Each growing message is checked against the catalog's Zod in a fresh renderer state before it may leave; partial messages wait. A rejected message → retry once with the error, then a text apology.", "source": "@a2ui/agent · demo/apps/agent/src/turn/agent.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/agent.ts", "lines": "231–266", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/agent.ts#L231-L266", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/9d2ec29ca1/samples/agent/node/restaurant_finder/src/agent.ts"}]}, {"id": "e-police", "label": "8 Policy on every message", "group": "agent", "order": 8, "detail": "enforcePolicy strips internal_notes and removes Delete (and anything bound to the notes) from every batch, each re-send included, before publishing. It also checks text: a text part, a literal string or a data model value that quotes a ticket's notes is withheld, since the model is given the notes.", "source": "demo/apps/agent/src/policy/policy.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/policy/policy.ts", "lines": "470–483", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/policy/policy.ts#L470-L483", "origin": "demo"}]}, {"id": "e-events", "label": "9 A2A status updates", "group": "agent", "order": 9, "detail": "working → working + data parts (one A2UI message each, application/a2ui+json) → final input-required (or completed). Text parts carry the fallback.", "source": "demo/apps/agent/src/turn/a2a.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/a2a.ts", "lines": "138–186", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/a2a.ts#L138-L186", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/a2a.ts"}]}, {"id": "e-unwrap", "label": "10 Unwrap to SSE", "group": "server", "order": 10, "detail": "Takes the A2UI messages out of the A2A parts and writes data: { messages, text?, sessionId } per event. No A2A reaches the browser.", "source": "demo/apps/client/src/server.ts", "status": "done", "payload": "data: {\"messages\":[…],\"sessionId\":\"<contextId>\"}", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "171–189", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L171-L189", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "e-render", "label": "11 Render", "group": "browser", "order": 11, "detail": "handleEvent stores the sessionId, applies each message: createSurface → updateComponents (validated again, same Zod objects) → updateDataModel; bindings resolve; the Angular catalog components draw the tickets.", "source": "demo/apps/client/src/app/agent/agent-client.ts · demo/apps/client/src/app/catalog/", "status": "done", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "196–222", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L196-L222", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "e-check", "label": "12 Renderer checks values", "group": "browser", "order": 12, "detail": "Phase 6: what web_core can't see, a bound value outside the schema (priority \"critical\" in the data model), PriorityBadge catches after resolving it; rejected components become placeholders.", "source": "demo/apps/client/src/app/catalog/priority-badge.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/catalog/priority-badge.ts", "lines": "49–78", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/catalog/priority-badge.ts#L49-L78", "origin": "demo"}]}, {"id": "e-report", "label": "13 VALIDATION_FAILED back", "group": "browser", "order": 13, "detail": "After the reply has rendered, at most 2 reports per user turn go back through the same POST /api/agent as { error }. The agent redoes the turn once; a second report gets the text fallback.", "source": "demo/apps/client/src/app/agent/agent-client.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "176–194", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L176-L194", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "e-session", "label": "sessionId = contextId", "group": "server", "order": 4, "detail": "The one place the two names meet: the browser keeps an opaque sessionId, the server passes it as A2A contextId, the agent keys its Gemini chat and its client-retry memory by it.", "source": "demo/apps/client/src/server.ts", "status": "done", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "116", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L116", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}], "edges": [{"from": "e-user", "to": "e-post", "label": "ask / handleAction"}, {"from": "e-post", "to": "e-a2a-out", "label": "HTTP POST"}, {"from": "e-a2a-out", "to": "e-negotiate", "label": "A2A JSON-RPC"}, {"from": "e-negotiate", "to": "e-query", "label": "inbound"}, {"from": "e-query", "to": "e-model", "label": "query + system prompt"}, {"from": "e-model", "to": "e-validate", "label": "text chunks"}, {"from": "e-validate", "to": "e-model", "label": "retry with the error"}, {"from": "e-validate", "to": "e-police", "label": "accepted messages"}, {"from": "e-police", "to": "e-events", "label": "A2A parts"}, {"from": "e-events", "to": "e-unwrap", "label": "A2A SSE"}, {"from": "e-unwrap", "to": "e-render", "label": "SSE"}, {"from": "e-render", "to": "e-check", "label": "resolved bindings"}, {"from": "e-check", "to": "e-report", "label": "issues"}, {"from": "e-report", "to": "e-post", "label": "{ error }"}, {"from": "e-render", "to": "e-user", "label": "Button click"}, {"from": "e-a2a-out", "to": "e-session", "label": "contextId"}, {"from": "e-session", "to": "e-query", "label": "chat + retry memory"}], "paths": [{"id": "ee-turn", "label": "\"Show me the open tickets\"", "note": "One turn across the three processes.", "nodes": ["e-user", "e-post", "e-a2a-out", "e-negotiate", "e-query", "e-model", "e-validate", "e-police", "e-events", "e-unwrap", "e-render"]}, {"id": "ee-open", "label": "Click Open on a row", "note": "The action round trip; the ticket is prefetched.", "nodes": ["e-render", "e-user", "e-post", "e-a2a-out", "e-negotiate", "e-query", "e-model", "e-validate", "e-police", "e-events", "e-unwrap", "e-render"]}, {"id": "ee-agentretry", "label": "The agent rejects its own reply", "note": "Fixed before anything leaves the agent.", "nodes": ["e-model", "e-validate", "e-model", "e-validate", "e-police", "e-events"]}, {"id": "ee-client", "label": "The renderer rejects a value (stages 5–6)", "note": "VALIDATION_FAILED goes back, the agent redoes the turn.", "nodes": ["e-render", "e-check", "e-report", "e-post", "e-a2a-out", "e-negotiate", "e-query", "e-model", "e-validate", "e-police", "e-events", "e-unwrap", "e-render"]}]}, {"key": "frontend", "tab": "Frontend", "layout": "stages", "title": "In the browser", "summary": "What happens inside the Angular app: AgentClient sends and reads, the @a2ui/angular renderer (web_core underneath) applies A2UI messages to surfaces and validates components, the catalog components draw them and, in phase 6, check the values their bindings resolve to. Nothing the agent sends is executed.", "groups": [{"id": "ui", "label": "App shell (app.ts)"}, {"id": "client", "label": "AgentClient"}, {"id": "renderer", "label": "Renderer (@a2ui/angular + web_core)"}, {"id": "catalog", "label": "Catalog components"}, {"id": "issues", "label": "ValidationIssues"}], "nodes": [{"id": "f-prompt", "label": "Prompt form", "group": "ui", "order": 1, "detail": "The user types a request (default \"Show me the open tickets\") and submits. app.ts calls AgentClient.ask(prompt). The input and button are disabled, and the surfaces inert, while isLoading() is true: one turn at a time.", "source": "demo/apps/client/src/app/app.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/app.ts", "lines": "15–21", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/app.ts#L15-L21", "origin": "demo"}, {"path": "demo/apps/client/src/app/app.ts", "lines": "74–77", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/app.ts#L74-L77", "origin": "demo"}]}, {"id": "f-status", "label": "Status lines", "group": "ui", "order": 2, "detail": "Three signals from AgentClient drive what the user sees besides the UI: waitingForUi() turns the Ask button into a pulsing \"Working…\" and dims the old view (both after 250 ms, so a stub reply doesn't flash), agentText() shows the agent's text-only answer (the fallback), error() shows a failed request. Nothing is added or removed above the surfaces, so nothing moves.", "source": "demo/apps/client/src/app/app.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/app.ts", "lines": "23–29", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/app.ts#L23-L29", "origin": "demo"}]}, {"id": "f-surfaces", "label": "Surface list", "group": "ui", "order": 3, "detail": "app.ts loops over renderer.surfaceGroup.surfacesMap inside a .surfaces wrapper (dimmed while waitingForUi) and draws one <a2ui-v09-surface [surfaceId]> per surface. Tracked by the SurfaceModel object, not its id, so a surface deleted and re-created under the same id is drawn afresh (incident 6).", "source": "demo/apps/client/src/app/app.ts", "status": "done", "payload": "@for (entry of renderer.surfaceGroup.surfacesMap; track entry[1]) {\n  <a2ui-v09-surface [surfaceId]=\"entry[0]\" />\n}", "links": [{"path": "demo/apps/client/src/app/app.ts", "lines": "35–39", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/app.ts#L35-L39", "origin": "demo"}]}, {"id": "f-panel", "label": "Demo panel (⌥⇧D)", "group": "ui", "order": 4, "detail": "Presenter-only, hidden by default; Alt+Shift+D shows it. Stub/Live, and in stub mode: first attempt invalid (the agent's retry), leaky replies (the policy), renderer rejects first attempt (VALIDATION_FAILED back to the agent); thinking level in live mode. GET/PUT /demo/flags through the app's own server; changes apply from the next prompt or click, no restart.", "source": "demo/apps/client/src/app/demo/demo-panel.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/demo/demo-panel.ts", "lines": "164–228", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/demo/demo-panel.ts#L164-L228", "origin": "demo"}]}, {"id": "f-ask", "label": "ask(query) / handleAction(event)", "group": "client", "order": 1, "detail": "The two ways a turn starts: a prompt, or a button action (the renderer calls handleAction through the actionHandler in app.config.ts). Both are ignored while a turn is still running; otherwise they reset the report counter and call send().", "source": "demo/apps/client/src/app/agent/agent-client.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "79–85", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L79-L85", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}, {"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "88–95", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L88-L95", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "f-send-prep", "label": "send(): mark stale, reset", "group": "client", "order": 2, "detail": "Before the request: marks the old surfaces to go on the reply's first A2UI message (they stay on screen, dimmed, until then: no empty flash on a fast stub reply, the old view kept on a slow live one), clears ValidationIssues, sets isLoading and waitingForUi, clears error and agentText. An error report works the same way: the partly rejected surface stays until the corrected reply arrives, or under the agent's text fallback.", "source": "demo/apps/client/src/app/agent/agent-client.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "97–115", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L97-L115", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "f-post", "label": "POST /api/agent", "group": "client", "order": 3, "detail": "One fetch to the app's own server, same origin. The body carries exactly one of query, event or error, plus the session id from the previous reply (absent on the first turn).", "source": "demo/apps/client/src/app/agent/agent-client.ts", "status": "done", "payload": "POST /api/agent  Content-Type: application/json\n{ \"query\": \"Show me the open tickets\", \"sessionId\": \"…\" }\n{ \"event\": { \"name\": \"open_ticket\", \"surfaceId\": \"tickets\",\n             \"sourceComponentId\": \"open_button\", \"timestamp\": \"…\",\n             \"context\": { \"ticketId\": \"TCK-1042\" } }, \"sessionId\": \"…\" }\n{ \"error\": { \"code\": \"VALIDATION_FAILED\", \"surfaceId\": \"tickets\",\n             \"path\": \"/tickets/0/priority\", \"message\": \"…\" }, \"sessionId\": \"…\" }", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "117–122", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L117-L122", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "f-sse", "label": "Read the SSE stream", "group": "client", "order": 4, "detail": "The response body is read as text, split on blank lines; each \"data: \" line is parsed as JSON and passed to handleEvent. A non-200 response shows the server's { error } message, or \"The server answered <status>\" when the body isn't that JSON. The browser gives up after 150 s.", "source": "demo/apps/client/src/app/agent/agent-client.ts", "status": "done", "payload": "data: {\"messages\":[…A2UI v0.9 messages…],\"text\":\"…\",\"sessionId\":\"<contextId>\"}\n\ndata: {\"error\":\"…\"}   (only if the stream fails after it started)", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "127–142", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L127-L142", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "f-handle", "label": "handleEvent()", "group": "client", "order": 5, "detail": "Per event: an error field throws; sessionId is stored for the next request; on the reply's first A2UI messages the old surfaces are deleted in one go; text goes to agentText (the old view stays); for each createSurface whose id already exists, that surface is deleted first (a retried reply starts over); then each message goes to process() one at a time, and waitingForUi turns off.", "source": "demo/apps/client/src/app/agent/agent-client.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "196–222", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L196-L222", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "f-process", "label": "process(message)", "group": "client", "order": 6, "detail": "Everything except updateComponents goes straight to the renderer. An updateComponents is tried whole; if web_core throws A2uiValidationError, each component is applied on its own and every rejected one is replaced by a placeholder Text with the same id (\"⚠ This part of the answer could not be shown.\"), and filed in ValidationIssues with path /components/<index>/<prop>.", "source": "demo/apps/client/src/app/agent/agent-client.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "231–258", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L231-L258", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "f-report", "label": "reportIssues()", "group": "client", "order": 7, "detail": "After the stream ends: waits for appRef.whenStable() (components have resolved their bindings), takes the first open issue, and if fewer than 2 reports were sent since the user's last prompt or action, calls send({ error }) with a v0.9 VALIDATION_FAILED. The message counts any other issues (\"and N more like it\").", "source": "demo/apps/client/src/app/agent/agent-client.ts", "status": "done", "payload": "{ \"code\": \"VALIDATION_FAILED\", \"surfaceId\": \"tickets\",\n  \"path\": \"/tickets/0/priority\",\n  \"message\": \"PriorityBadge (ticket_priority): priority resolved to \\\"critical\\\" from /tickets/0/priority, which the PriorityBadge schema does not allow (…)\" }", "links": [{"path": "demo/apps/client/src/app/agent/agent-client.ts", "lines": "176–194", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/agent-client.ts#L176-L194", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/app/client.ts"}]}, {"id": "f-service", "label": "A2uiRendererService.processMessages", "group": "renderer", "order": 1, "detail": "The library's entry point. Applies A2UI v0.9 messages to its SurfaceGroup. Registered in app.config.ts with provideA2Ui({ catalogs: [ticket catalog, BasicCatalog], actionHandler }).", "source": "demo/apps/client/src/app/app.config.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/app.config.ts", "lines": "11–19", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/app.config.ts#L11-L19", "origin": "demo"}]}, {"id": "f-create", "label": "createSurface", "group": "renderer", "order": 2, "detail": "Creates a SurfaceModel for surfaceId, bound to the catalog named by catalogId (the ticket catalog). Throws if the id already exists, which is why AgentClient deletes it first.", "source": "@a2ui/web_core v0.9", "status": "done", "payload": "{ \"version\": \"v0.9\", \"createSurface\": { \"surfaceId\": \"tickets\",\n  \"catalogId\": \"https://github.com/giorgiogalassi/talk-a2ui/demo/catalogs/tickets/v0_9/catalog.json\" } }"}, {"id": "f-components", "label": "updateComponents → validate", "group": "renderer", "order": 3, "detail": "Validates every component against the surface catalog's Zod schema (the same ComponentApi objects the agent uses, from packages/catalog). One invalid component rejects the whole message with A2uiValidationError; it never looks at the values bindings resolve to.", "source": "@a2ui/web_core v0.9", "status": "done", "payload": "{ \"version\": \"v0.9\", \"updateComponents\": { \"surfaceId\": \"tickets\", \"components\": [\n  { \"id\": \"root\", \"component\": \"TicketList\", \"title\": { \"path\": \"/title\" },\n    \"children\": { \"componentId\": \"ticket_row\", \"path\": \"/tickets\" } },\n  { \"id\": \"ticket_priority\", \"component\": \"PriorityBadge\", \"priority\": { \"path\": \"priority\" } }, … ] } }"}, {"id": "f-datamodel", "label": "updateDataModel → data model", "group": "renderer", "order": 4, "detail": "Writes value at path in the surface's local data model. Components re-read the paths they bind. Typing into an input also writes here, and sends nothing to the agent.", "source": "@a2ui/web_core v0.9", "status": "done", "payload": "{ \"version\": \"v0.9\", \"updateDataModel\": { \"surfaceId\": \"tickets\", \"path\": \"/\",\n  \"value\": { \"title\": \"Open tickets\", \"tickets\": [ { \"id\": \"TCK-1042\", \"priority\": \"urgent\", … } ] } } }"}, {"id": "f-bind", "label": "Bindings resolve", "group": "renderer", "order": 5, "detail": "A prop like { \"path\": \"priority\" } is read from the data model. Inside a template row the path is relative to the row (/tickets/0), so it resolves /tickets/0/priority. Each catalog component reads it through props().<name>.value().", "source": "@a2ui/angular v0.9", "status": "done"}, {"id": "f-action", "label": "Button click → action", "group": "renderer", "order": 6, "detail": "A Button's action.event.context paths are resolved against the data model at click time, and the renderer calls the actionHandler with an A2uiClientAction. Nothing runs locally: the action only goes back to the agent.", "source": "demo/apps/client/src/app/app.config.ts", "status": "done", "payload": "{ \"name\": \"open_ticket\", \"surfaceId\": \"tickets\", \"sourceComponentId\": \"open_button\",\n  \"timestamp\": \"2026-…Z\", \"context\": { \"ticketId\": \"TCK-1042\" } }", "links": [{"path": "demo/apps/client/src/app/app.config.ts", "lines": "17", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/app.config.ts#L17", "origin": "demo"}]}, {"id": "f-ticketlist", "label": "TicketList", "group": "catalog", "order": 1, "detail": "Draws the title and one row per child; the children come from the template over /tickets, each row a component host with its own data context.", "source": "demo/apps/client/src/app/catalog/ticket-list.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/catalog/ticket-list.ts", "lines": "45–48", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/catalog/ticket-list.ts#L45-L48", "origin": "demo"}]}, {"id": "f-badge", "label": "PriorityBadge", "group": "catalog", "order": 2, "detail": "Typed from PriorityBadgeApi (priority: low | medium | high | urgent). After resolving a bound priority it checks the value with resolvedValueProblem(); a value outside the enum shows a dashed \"?\" and files an issue under surface#component@dataContextPath; a valid value withdraws it.", "source": "demo/apps/client/src/app/catalog/priority-badge.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/catalog/priority-badge.ts", "lines": "49–78", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/catalog/priority-badge.ts#L49-L78", "origin": "demo"}]}, {"id": "f-resolved", "label": "resolvedValueProblem()", "group": "catalog", "order": 3, "detail": "Phase 6: checks a resolved bound value against the catalog's own Zod for that prop (the value branch of the union only). Returns the absolute data-model path and a message, or null.", "source": "demo/apps/client/src/app/catalog/resolved-value.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/catalog/resolved-value.ts", "lines": "19–41", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/catalog/resolved-value.ts#L19-L41", "origin": "demo"}]}, {"id": "f-chip", "label": "AssigneeChip, basic components", "group": "catalog", "order": 4, "detail": "AssigneeChip draws initials + name (\"Unassigned\" when empty). Text, Row, Column, Card, Divider and Button are the library's own Angular components, limited to the ones the ticket catalog lists.", "source": "demo/apps/client/src/app/catalog/ticket-catalog.ts", "status": "done", "links": [{"path": "demo/apps/client/src/app/catalog/ticket-catalog.ts", "lines": "21–34", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/catalog/ticket-catalog.ts#L21-L34", "origin": "demo"}]}, {"id": "f-issues", "label": "ValidationIssues", "group": "issues", "order": 1, "detail": "A map of open problems for the current reply, keyed by whoever found them (AgentClient for a rejected component, PriorityBadge for a bad bound value). Cleared at every send(); read by reportIssues().", "source": "demo/apps/client/src/app/agent/validation-issues.ts", "status": "done", "payload": "{ surfaceId: string, path: string /* JSON pointer */, message: string }", "links": [{"path": "demo/apps/client/src/app/agent/validation-issues.ts", "lines": "18–35", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/app/agent/validation-issues.ts#L18-L35", "origin": "demo"}]}], "edges": [{"from": "f-prompt", "to": "f-ask", "label": "ask(prompt)"}, {"from": "f-ask", "to": "f-send-prep", "label": "send({query} | {event})"}, {"from": "f-send-prep", "to": "f-issues", "label": "clear()"}, {"from": "f-send-prep", "to": "f-post", "label": "fetch"}, {"from": "f-post", "to": "f-sse", "label": "SSE response"}, {"from": "f-sse", "to": "f-handle", "label": "each data: line"}, {"from": "f-handle", "to": "f-status", "label": "agentText / waitingForUi / error"}, {"from": "f-handle", "to": "f-process", "label": "one message at a time"}, {"from": "f-process", "to": "f-service", "label": "processMessages([msg])"}, {"from": "f-service", "to": "f-create", "label": "createSurface"}, {"from": "f-service", "to": "f-components", "label": "updateComponents"}, {"from": "f-service", "to": "f-datamodel", "label": "updateDataModel"}, {"from": "f-components", "to": "f-process", "label": "A2uiValidationError"}, {"from": "f-process", "to": "f-issues", "label": "rejected component"}, {"from": "f-create", "to": "f-surfaces", "label": "new SurfaceModel"}, {"from": "f-create", "to": "f-components", "label": "next message"}, {"from": "f-components", "to": "f-datamodel", "label": "next message"}, {"from": "f-surfaces", "to": "f-ticketlist", "label": "renders root"}, {"from": "f-ticketlist", "to": "f-bind", "label": "row data context"}, {"from": "f-datamodel", "to": "f-bind", "label": "values"}, {"from": "f-bind", "to": "f-badge", "label": "priority"}, {"from": "f-bind", "to": "f-chip", "label": "name, text"}, {"from": "f-badge", "to": "f-resolved", "label": "check value"}, {"from": "f-badge", "to": "f-issues", "label": "bad bound value"}, {"from": "f-chip", "to": "f-action", "label": "Button click"}, {"from": "f-action", "to": "f-ask", "label": "actionHandler → handleAction"}, {"from": "f-sse", "to": "f-report", "label": "stream done"}, {"from": "f-issues", "to": "f-report", "label": "list()"}, {"from": "f-report", "to": "f-send-prep", "label": "send({error})"}, {"from": "f-panel", "to": "f-post", "label": "GET/PUT /demo/flags (same origin)"}], "paths": [{"id": "fe-prompt", "label": "A prompt, start to screen", "note": "From the form to a drawn ticket list.", "nodes": ["f-prompt", "f-ask", "f-send-prep", "f-post", "f-sse", "f-handle", "f-process", "f-service", "f-create", "f-components", "f-datamodel", "f-bind", "f-badge"]}, {"id": "fe-action", "label": "A button action", "note": "Open on a row: the context is resolved locally, then the turn starts over.", "nodes": ["f-chip", "f-action", "f-ask", "f-send-prep", "f-post"]}, {"id": "fe-rejected", "label": "A component web_core rejects", "note": "Placeholder for the bad one, the rest renders, the problem is filed.", "nodes": ["f-process", "f-service", "f-components", "f-process", "f-issues", "f-report"]}, {"id": "fe-bound", "label": "A bad bound value (stage 5–6)", "note": "Valid component, invalid value: only the renderer can see it.", "nodes": ["f-datamodel", "f-bind", "f-badge", "f-resolved", "f-badge", "f-issues", "f-report", "f-send-prep", "f-post"]}]}, {"key": "backend", "tab": "Backend", "layout": "stages", "title": "SSR server and agent", "summary": "The SSR server is a bridge, not a page renderer here (every route is RenderMode.Client): it turns the browser's POST into an A2A message and the agent's A2A events into SSE. The agent negotiates the catalog, builds the query, asks the model, validates every streamed message against the Zod catalog, applies the server-side policy and publishes A2A status updates.", "groups": [{"id": "ssr", "label": "SSR server (server.ts)"}, {"id": "a2a", "label": "Agent: A2A endpoint"}, {"id": "exec", "label": "Agent: executor (agent.ts)"}, {"id": "model", "label": "Agent: model + tool"}, {"id": "guard", "label": "Agent: validation + policy"}], "nodes": [{"id": "b-route", "label": "POST /api/agent", "group": "ssr", "order": 1, "detail": "The Express route the browser calls. Reads { query, event, error, sessionId } and checks their types (400 otherwise; a body that isn't JSON gets a JSON 400, not Express's HTML page). A malformed error (missing string code, surfaceId, message, or path for VALIDATION_FAILED) gets 400 and goes no further.", "source": "demo/apps/client/src/server.ts", "status": "done", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "112–200", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L112-L200", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "b-part", "label": "Build the A2A message", "group": "ssr", "order": 2, "detail": "Exactly one part: event → data part { version, action }; error → data part { version, error }; otherwise a text part with the query. The browser's sessionId becomes A2A contextId. The catalogs the app can draw go in metadata: capability negotiation, ids only.", "source": "demo/apps/client/src/server.ts", "status": "done", "payload": "{ \"message\": { \"kind\": \"message\", \"messageId\": \"<uuid>\", \"role\": \"user\",\n  \"contextId\": \"<sessionId>\",\n  \"parts\": [ { \"kind\": \"text\", \"text\": \"Show me the open tickets\" } ],\n  \"metadata\": { \"a2uiClientCapabilities\": { \"v0.9\": {\n    \"supportedCatalogIds\": [ \"https://github.com/giorgiogalassi/talk-a2ui/demo/catalogs/tickets/v0_9/catalog.json\" ] } } } } }\n\naction: { \"kind\": \"data\", \"data\": { \"version\": \"v0.9\", \"action\": {…} },\n          \"metadata\": { \"mimeType\": \"application/a2ui+json\" } }\nerror:  { \"kind\": \"data\", \"data\": { \"version\": \"v0.9\", \"error\": {…} }, … }", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "133–145", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L133-L145", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "b-card", "label": "getAgent(): agent card", "group": "ssr", "order": 3, "detail": "On first use: GET <AGENT_URL>/.well-known/agent-card.json (AGENT_URL defaults to http://localhost:10002). The A2AClient is cached; a failed lookup is not (PR #9), so the next request tries again. Every request to the agent carries the header X-A2A-Extensions: https://a2ui.org/a2a-extension/a2ui/v0.9.", "source": "demo/apps/client/src/server.ts", "status": "done", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "86–100", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L86-L100", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "b-stream", "label": "sendMessageStream", "group": "ssr", "order": 4, "detail": "A2A JSON-RPC message/stream to the URL in the agent card (http://localhost:10002/a2a/json-rpc). The answer is a stream of A2A events.", "source": "demo/apps/client/src/server.ts", "status": "done", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "164", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L164", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "b-unwrap", "label": "Unwrap A2A events", "group": "ssr", "order": 5, "detail": "For each event: task and status-update → status.message.parts; artifact-update → artifact.parts. Data parts are the A2UI messages; text parts are joined into text. The only file that knows A2A: swapping the transport means rewriting this one.", "source": "demo/apps/client/src/server.ts", "status": "done", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "171–189", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L171-L189", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "b-sse", "label": "Write SSE to the browser", "group": "ssr", "order": 6, "detail": "Headers text/event-stream, no-cache, keep-alive, X-Accel-Buffering: no. One line per A2A event that has messages, text or a contextId (in practice every event). Errors: the details go to this server's log; the browser gets a fixed message (\"The agent is not reachable…\" / \"…could not answer…\"): before the first byte as 502 { error }, after as data: { error }. If the browser disconnects, the server stops reading the agent's stream.", "source": "demo/apps/client/src/server.ts", "status": "done", "payload": "data: {\"messages\":[{ \"version\":\"v0.9\",\"createSurface\":{…} }, …],\"sessionId\":\"<contextId>\"}\n\ndata: {\"messages\":[],\"text\":\"I'm sorry, I'm having trouble…\",\"sessionId\":\"…\"}", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "165–170", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L165-L170", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}, {"path": "demo/apps/client/src/server.ts", "lines": "192–197", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L192-L197", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "b-flagsproxy", "label": "/demo/flags forward", "group": "ssr", "order": 7, "detail": "GET and PUT /demo/flags are forwarded to the agent's own /demo/flags. PUT only from this machine (403 otherwise), so no one on the venue's network can flip the demo; an unreachable agent → 502.", "source": "demo/apps/client/src/server.ts", "status": "done", "links": [{"path": "demo/apps/client/src/server.ts", "lines": "209–216", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L209-L216", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}, {"path": "demo/apps/client/src/server.ts", "lines": "218–230", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/client/src/server.ts#L218-L230", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/0af1b1e7/samples/client/angular/projects/restaurant/src/server.ts"}]}, {"id": "b-express", "label": "Agent HTTP server :10002", "group": "a2a", "order": 1, "detail": "Express app: GET /.well-known/agent-card.json, POST /a2a/json-rpc, GET/PUT /demo/flags. No CORS: only the app's server calls it. No authentication (UserBuilder.noAuthentication). Exits with a message if its port is already taken.", "source": "demo/apps/agent/src/index.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/index.ts", "lines": "109–144", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/index.ts#L109-L144", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/index.ts"}]}, {"id": "b-cardjson", "label": "Agent card", "group": "a2a", "order": 2, "detail": "name \"Support Ticket Agent\" (\"(stub)\" in stub mode), protocolVersion 0.3.0, url http://localhost:<port>/a2a/json-rpc, capabilities.streaming true, one skill show_tickets.", "source": "demo/apps/agent/src/index.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/index.ts", "lines": "39–60", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/index.ts#L39-L60", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/index.ts"}]}, {"id": "b-handler", "label": "DefaultRequestHandler", "group": "a2a", "order": 3, "detail": "@a2a-js/sdk 0.3.13 with an InMemoryTaskStore. Calls TicketExecutor.execute(requestContext, eventBus) once per incoming message and streams what the executor publishes on the event bus.", "source": "demo/apps/agent/src/index.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/index.ts", "lines": "103–107", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/index.ts#L103-L107", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/index.ts"}]}, {"id": "b-flags", "label": "DemoFlagStore: /demo/flags", "group": "a2a", "order": 4, "detail": "The stage switches: stub, invalidFirst, leaky, clientInvalid, thinkingLevel. Start from the env (STUB_LLM, STUB_INVALID_FIRST, STUB_LEAKY, STUB_CLIENT_INVALID, GEMINI_THINKING_LEVEL); GET reads them, PUT changes them (local only, unknown keys or bad values → 400, Live without GEMINI_API_KEY → 400). Every turn reads them, so a change applies from the next one.", "source": "demo/apps/agent/src/demo/demo-flags.ts · demo/apps/agent/src/index.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/demo/demo-flags.ts", "lines": "49–95", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/demo/demo-flags.ts#L49-L95", "origin": "demo"}, {"path": "demo/apps/agent/src/index.ts", "lines": "120–133", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/index.ts#L120-L133", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/index.ts"}]}, {"id": "b-run", "label": "execute → run()", "group": "exec", "order": 1, "detail": "One turn. Publishes the Task (state submitted) if this is a new task; any exception becomes a final failed status with a text part (\"The agent could not answer this request: …\").", "source": "demo/apps/agent/src/turn/agent.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/agent.ts", "lines": "111–160", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/agent.ts#L111-L160", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/9d2ec29ca1/samples/agent/node/restaurant_finder/src/agent.ts"}]}, {"id": "b-pick", "label": "pickA2ui()", "group": "exec", "order": 2, "detail": "Reads metadata.a2uiClientCapabilities[\"v0.9\"].supportedCatalogIds (or a2uiRendererCapabilities for v1.0; the newest named wins). Unknown versions throw. Result: version profile v0.9 + the ticket catalog id.", "source": "demo/apps/agent/src/turn/pick-a2ui.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/pick-a2ui.ts", "lines": "43–54", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/pick-a2ui.ts#L43-L54", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/pick-a2ui.ts"}]}, {"id": "b-inbound", "label": "readInboundMessage()", "group": "exec", "order": 3, "detail": "Splits the message into text, action ({ name, context } from data.action with the matching version, or a legacy userAction) and clientError (data.error with string code, surfaceId, message, and path for VALIDATION_FAILED).", "source": "demo/apps/agent/src/turn/a2a.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/a2a.ts", "lines": "88–122", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/a2a.ts#L88-L122", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/a2a.ts"}]}, {"id": "b-prompt", "label": "System prompt", "group": "exec", "order": 4, "detail": "createProcessor(profile, catalogIds) builds the processor for the negotiated catalogs (and rejects unknown ones); its promptSnippet holds the catalog document from toJson() and the ticket examples. buildSystemPrompt adds the role and the A2UI format rules.", "source": "demo/apps/agent/src/turn/agent.ts · demo/apps/agent/src/model/prompt.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/agent.ts", "lines": "167–170", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/agent.ts#L167-L170", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/9d2ec29ca1/samples/agent/node/restaurant_finder/src/agent.ts"}, {"path": "demo/apps/agent/src/model/prompt.ts", "lines": "43–45", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/model/prompt.ts#L43-L45", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/prompt.ts"}]}, {"id": "b-query", "label": "buildUserQuery()", "group": "exec", "order": 5, "detail": "Text → the query as is (\"Hello!\" if empty). open_ticket → fetches the ticket t's notes, matched per sentence. Deletes forbidden data from updateDataModel values and empties strings that quote a note; removes components that bind forbidden data, carry a disabled action or quote a note, mending the tree; replaces a text part that quotes a note. A paraphrase is not caught. Logs one line per strip.", "source": "demo/apps/agent/src/policy/policy.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/policy/policy.ts", "lines": "470–483", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/policy/policy.ts#L470-L483", "origin": "demo"}, {"path": "demo/apps/agent/src/policy/policy.ts", "lines": "443–463", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/policy/policy.ts#L443-L463", "origin": "demo"}]}, {"id": "b-toparts", "label": "toA2aParts()", "group": "guard", "order": 3, "detail": "One A2A data part per A2UI message, metadata.mimeType application/a2ui+json; text stays a text part.", "source": "demo/apps/agent/src/turn/a2a.ts", "status": "done", "links": [{"path": "demo/apps/agent/src/turn/a2a.ts", "lines": "31–42", "url": "https://github.com/giorgiogalassi/talk-a2ui/blob/main/demo/apps/agent/src/turn/a2a.ts#L31-L42", "origin": "sample", "upstream": "https://github.com/a2ui-project/a2ui/blob/3a64be7/samples/agent/node/restaurant_finder/src/a2a.ts"}]}], "edges": [{"from": "b-route", "to": "b-part", "label": "body"}, {"from": "b-part", "to": "b-card", "label": "getAgent()"}, {"from": "b-card", "to": "b-cardjson", "label": "GET agent card"}, {"from": "b-card", "to": "b-stream", "label": "A2AClient"}, {"from": "b-stream", "to": "b-express", "label": "POST /a2a/json-rpc message/stream"}, {"from": "b-express", "to": "b-handler", "label": "JSON-RPC"}, {"from": "b-handler", "to": "b-run", "label": "execute()"}, {"from": "b-run", "to": "b-pick", "label": "1. negotiate"}, {"from": "b-pick", "to": "b-inbound", "label": "2. read"}, {"from": "b-pick", "to": "b-prompt", "label": "catalogIds"}, {"from": "b-inbound", "to": "b-query", "label": "text / action"}, {"from": "b-inbound", "to": "b-clientretry", "label": "clientError"}, {"from": "b-clientretry", "to": "b-generate", "label": "retry: first query = error"}, {"from": "b-clientretry", "to": "b-publish", "label": "no retry: FALLBACK_TEXT"}, {"from": "b-query", "to": "b-tool", "label": "open_ticket prefetch"}, {"from": "b-query", "to": "b-generate", "label": "query"}, {"from": "b-prompt", "to": "b-generate", "label": "systemPrompt"}, {"from": "b-generate", "to": "b-backend", "label": "streamTurn(turn)"}, {"from": "b-backend", "to": "b-gemini", "label": "live"}, {"from": "b-backend", "to": "b-stub", "label": "stub switch on"}, {"from": "b-gemini", "to": "b-tool", "label": "function call"}, {"from": "b-tool", "to": "b-gemini", "label": "functionResponse"}, {"from": "b-gemini", "to": "b-feed", "label": "text chunks"}, {"from": "b-stub", "to": "b-feed", "label": "text chunks"}, {"from": "b-feed", "to": "b-policy", "label": "accepted messages"}, {"from": "b-feed", "to": "b-generate", "label": "A2uiError → retry"}, {"from": "b-policy", "to": "b-toparts", "label": "policed messages"}, {"from": "b-toparts", "to": "b-publish", "label": "A2A parts"}, {"from": "b-publish", "to": "b-handler", "label": "event bus"}, {"from": "b-handler", "to": "b-unwrap", "label": "A2A events (SSE)"}, {"from": "b-unwrap", "to": "b-sse", "label": "messages, text, contextId"}, {"from": "b-flagsproxy", "to": "b-flags", "label": "forward"}, {"from": "b-flags", "to": "b-backend", "label": "read per turn"}], "paths": [{"id": "be-prompt", "label": "A prompt turn, live", "note": "Through the SSR server into the agent and back out as SSE.", "nodes": ["b-route", "b-part", "b-card", "b-stream", "b-express", "b-handler", "b-run", "b-pick", "b-inbound", "b-query", "b-generate", "b-backend", "b-gemini", "b-tool", "b-gemini", "b-feed", "b-policy", "b-toparts", "b-publish", "b-handler", "b-unwrap", "b-sse"]}, {"id": "be-retry", "label": "Server
