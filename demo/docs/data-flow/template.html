<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2UI Demo Data Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Reader first: the selected node fills a wide reading pane; the graph is a navigator beside it.
   With nothing selected the pane is an index of every node. Stacks on phones, reader on top. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1d2321; --muted: #5d6763; --line: #d9ddd8;
  --accent: #1f6f78; --accent-soft: #d7ebec; --dim: 0.12;
  --g1: #1f6f78; --g2: #b4532a; --g3: #6a4fa3; --g4: #3f7d3a; --g5: #a8761a; --g6: #b23a62; --g7: #4b6584; --g8: #7a7f2a;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121615; --surface: #1a1f1e; --ink: #e6ebe8; --muted: #9aa5a0; --line: #2c3432;
  --accent: #5fb7bf; --accent-soft: #1d3a3d; --dim: 0.14;
  --g1: #5fb7bf; --g2: #e08a60; --g3: #a993dd; --g4: #7fbf73; --g5: #d9ad55; --g6: #e47b9f; --g7: #8fa7c7; --g8: #b8bd5c;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121615; --surface: #1a1f1e; --ink: #e6ebe8; --muted: #9aa5a0; --line: #2c3432;
  --accent: #5fb7bf; --accent-soft: #1d3a3d; --dim: 0.14;
  --g1: #5fb7bf; --g2: #e08a60; --g3: #a993dd; --g4: #7fbf73; --g5: #d9ad55; --g6: #e47b9f; --g7: #8fa7c7; --g8: #b8bd5c;
  color-scheme: dark }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { display: flex; flex-direction: column; height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; margin-right: auto; }
h1 small { font-family: var(--font-mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-left: 8px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs button { font: 500 13px var(--font-body); color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { position: relative; }
.search input { font: 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 240px; max-width: 100%; }
.results { position: absolute; top: calc(100% + 4px); left: 0; width: min(380px, 90vw); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.14); padding: 4px; margin: 0; list-style: none; max-height: 60vh; overflow: auto; }
.results[hidden] { display: none; }
.results li { padding: 7px 9px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.results li[aria-selected="true"], .results li:hover { background: var(--accent-soft); }
.results li small { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); gap: 12px; }
.reader { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-y: auto; padding: 22px clamp(18px, 3vw, 40px) 28px; }
.side { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.stage { position: relative; flex: 1 1 55%; min-height: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#cy { position: absolute; inset: 0; }
.legend { position: absolute; top: 8px; left: 8px; right: 52px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 2; pointer-events: none; }
.legend > * { pointer-events: auto; }
.chip { font: 500 10.5px var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px 3px 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip i, .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="false"] i { background: transparent !important; outline: 1px solid var(--muted); }
.fit { position: absolute; right: 8px; top: 8px; z-index: 2; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 0 1 auto; max-height: 45%; }
.eyebrow { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
.walks { display: flex; flex-direction: column; gap: 6px; }
.walk { text-align: left; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.walk b { display: block; font-size: 13.5px; font-weight: 600; }
.walk span { display: block; font-size: 12.5px; color: var(--muted); }
.walk[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.btn { font: 500 12.5px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:disabled { opacity: 0.4; cursor: default; }
/* Reader */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 0 0 14px; }
.crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
.crumbs a:hover { text-decoration: underline; }
.walkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; margin: 0 0 16px; font-size: 13.5px; }
.walkbar b { margin-right: auto; }
.walkbar[hidden] { display: none; }
.node-title { font-size: clamp(22px, 2.4vw, 28px); line-height: 1.2; font-weight: 650; margin: 0 0 10px; letter-spacing: -0.015em; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.pill { font: 500 11.5px var(--font-mono); border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.pill.st-done { color: var(--ink); }
.pill.st-dashed { border-style: dashed; color: var(--ink); }
.detail { font-size: 17px; line-height: 1.62; max-width: 70ch; margin: 0 0 18px; white-space: pre-line; }
.payload { margin: 0 0 18px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 12.5px/1.5 var(--font-mono); white-space: pre-wrap; word-break: break-word; max-width: 90ch; }
.label-row { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
.srclist { list-style: none; padding: 0; margin: 0 0 22px; display: flex; flex-direction: column; gap: 4px; font: 13px var(--font-mono); word-break: break-word; }
.srclist a { color: var(--accent); display: inline-flex; flex-wrap: wrap; gap: 0 10px; }
.srclist .lines { color: var(--muted); }
.conn { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 24px; margin: 0 0 22px; }
.conn ul, .idx ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.conn li a, .idx li a { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; color: var(--ink); text-decoration: none; cursor: pointer; }
.conn li a:hover, .idx li a:hover { background: var(--accent-soft); }
.conn li a .dot { position: relative; top: 1px; }
.conn em { font-style: normal; font: 12px var(--font-mono); color: var(--muted); display: block; }
.conn .none { color: var(--muted); font-size: 13.5px; }
.sibnav { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.sibnav a { color: var(--accent); cursor: pointer; text-decoration: none; font-size: 14px; max-width: 48%; }
.sibnav a:hover { text-decoration: underline; }
.sibnav .next { text-align: right; margin-left: auto; }
.keys { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
kbd { font: 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
/* Index */
.summary { font-size: 16px; line-height: 1.6; max-width: 72ch; margin: 0 0 8px; }
.note { color: var(--muted); font-size: 13.5px; max-width: 72ch; margin: 0 0 20px; }
.idx h2 { font-size: 14px; margin: 22px 0 6px; display: flex; align-items: center; gap: 8px; }
.idx h2 small { color: var(--muted); font-weight: 400; }
.idx li a span.lbl { flex: 1; min-width: 0; }
.idx li a small { color: var(--muted); font: 11.5px var(--font-mono); white-space: nowrap; }
.idx .ord { color: var(--muted); font: 12px var(--font-mono); min-width: 2ch; text-align: right; }
@media (max-width: 900px) {
  html, body { height: auto; }
  .wrap { height: auto; }
  main { grid-template-columns: 1fr; }
  .reader { overflow: visible; }
  .stage { flex: none; height: 52vh; }
  section.card { max-height: none; }
  .search input { width: 180px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>A2UI demo: data flow <small>talk-a2ui · A2UI v0.9</small></h1>
    <div class="search">
      <input id="search" type="search" placeholder="Find a node…  ( / )" aria-label="Find a node" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>
  <main>
    <article class="reader" id="reader" aria-live="polite" tabindex="-1"></article>
    <div class="side">
      <div class="stage">
        <div class="legend" id="legend"></div>
        <div id="cy" role="img" aria-label="Graph of the nodes; the reading pane lists the same nodes and their connections"></div>
        <button class="btn fit" id="fit" type="button" title="Fit the whole graph">Fit</button>
      </div>
      <section class="card" id="walkcard">
        <p class="eyebrow">Guided walks</p>
        <div class="walks" id="walks"></div>
      </section>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
// Built by build.py from graph.json: edit graph.json, then run `python3 build.py`.
const GRAPHS = /*DATA*/[];
// Per page: what the index explains, and where repo-relative `source` paths link to.
const PAGE = {
  note: 'Columns in the graph are where the code runs; top to bottom is the order things happen. Pick a node to read its file and the exact payload, or start a walk for one complete path.',
  sourceBase: 'https://github.com/giorgiogalassi/talk-a2ui/blob/main/',
};
const GCOL = ['--g1','--g2','--g3','--g4','--g5','--g6','--g7','--g8'];
const DASHED = new Set(['proposed','pending','planned','open','goal']);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids.filter(k => k != null && k !== false)); return e; };
let cy, G, groupColor = {}, hidden = new Set(), walk = null, step = 0, current = null;

const reader = document.getElementById('reader');
const tabs = document.getElementById('tabs');
GRAPHS.forEach(g => {
  const b = el('button', { type: 'button', id: 'tab-' + g.key, textContent: g.tab });
  b.setAttribute('role', 'tab');
  b.onclick = () => go(g.key, null);
  tabs.appendChild(b);
});

// ---- Routing: #graph or #graph/node, so a node can be bookmarked and the Back button works.
function go(key, id) { const h = '#' + key + (id ? '/' + encodeURIComponent(id) : ''); if (location.hash !== h) location.hash = h; else route(); }
function route() {
  const [key, raw] = location.hash.slice(1).split('/');
  const id = raw ? decodeURIComponent(raw) : null;
  const next = GRAPHS.find(g => g.key === key) || GRAPHS[0];
  if (next !== G) load(next);
  if (walk && id && !walk.nodes.includes(id)) { walk = null; markWalks(); }
  if (walk && id) step = walk.nodes.indexOf(id);
  select(id && G.nodes.some(n => n.id === id) ? id : null);
}

function load(g) {
  G = g;
  [...tabs.children].forEach(b => b.setAttribute('aria-selected', String(b.id === 'tab-' + G.key)));
  groupColor = {}; G.groups.forEach((gr, i) => groupColor[gr.id] = GCOL[i % GCOL.length]);
  hidden = new Set(); walk = null; current = null;
  renderLegend(); renderWalks(); draw();
}

// ---- Helpers over the data
const node = id => G.nodes.find(n => n.id === id);
const groupOf = n => G.groups.find(g => g.id === n.group) || { id: n.group, label: n.group };
const color = gid => `var(${groupColor[gid] || '--g7'})`;
const fmtDate = d => { if (!d) return ''; const t = new Date(d + 'T12:00:00'); return isNaN(t) ? d : t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
// A group's reading order: its `order` if the nodes have one, else the order they are written in.
function inGroup(gid) {
  const idx = new Map(G.nodes.map((n, i) => [n.id, i]));
  return G.nodes.filter(n => n.group === gid).sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || idx.get(a.id) - idx.get(b.id));
}
function dot(gid) { const d = el('span', { className: 'dot' }); d.style.background = color(gid); return d; }
function statusPill(s) { return s ? el('span', { className: 'pill ' + (DASHED.has(s) ? 'st-dashed' : 'st-done'), textContent: s }) : null; }
function link(id, ...kids) { const a = el('a', { href: '#' + G.key + '/' + encodeURIComponent(id) }, ...kids); return a; }
// The code behind a node: `links` (file + lines, written by build.py) first, then whatever else
// `source` names (a package, a folder, a URL).
function sourceEl(n) {
  const links = n.links || [];
  const rest = (n.source || '').split(' · ').filter(s => s && !links.some(l => l.path === s));
  if (!links.length && !rest.length) return null;
  const box = el('ul', { className: 'srclist' });
  links.forEach(l => box.append(el('li', {}, el('a', { href: l.url, target: '_blank', rel: 'noopener' },
    el('span', { textContent: l.path }), el('span', { className: 'lines', textContent: 'L' + l.lines })))));
  rest.forEach(s => {
    const url = /^https?:\/\//.test(s) ? s : (PAGE.sourceBase && /^[\w@.-]+\/[\w./@-]+$/.test(s) && !s.includes(' ') ? PAGE.sourceBase + s.replace(/\/$/, '') : null);
    box.append(el('li', {}, url ? el('a', { href: url, target: '_blank', rel: 'noopener', textContent: s }) : s));
  });
  return box;
}

// ---- Reader: one node, or the index
function select(id) {
  current = id;
  if (!id) { renderIndex(); highlight(null); return; }
  renderNode(id); highlight(id);
}

function renderIndex() {
  reader.replaceChildren(
    el('p', { className: 'crumbs' }, el('span', { textContent: G.title })),
    el('h2', { className: 'node-title', textContent: G.title }),
    el('p', { className: 'summary', textContent: G.summary }),
    el('p', { className: 'note', textContent: PAGE.note }),
  );
  // Dates are when a thing happened or is due: split what's ahead from what just happened.
  const today = new Date().toISOString().slice(0, 10);
  const dated = G.nodes.filter(n => n.date);
  if (dated.length > 3) {
    const ahead = dated.filter(n => n.date > today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 8);
    const recent = dated.filter(n => n.date <= today).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
    if (ahead.length) reader.append(indexList('Coming up next', ahead, n => [n.status !== 'done' && n.status, fmtDate(n.date)].filter(Boolean).join(' · '), true));
    if (recent.length) reader.append(indexList('Most recent', recent, n => [n.status !== 'done' && n.status, fmtDate(n.date)].filter(Boolean).join(' · '), true));
  }
  G.groups.forEach(gr => reader.append(indexList(gr.label, inGroup(gr.id), n => [n.status !== 'done' && n.status, fmtDate(n.date)].filter(Boolean).join(' · '), false, gr.id)));
  reader.append(el('p', { className: 'keys' }, el('kbd', { textContent: '/' }), ' search · ', el('kbd', { textContent: '←' }), ' ', el('kbd', { textContent: '→' }), ' previous / next · ', el('kbd', { textContent: 'Esc' }), ' back to this index'));
  reader.scrollTop = 0;
}

function indexList(title, nodes, sub, showGroup, gid) {
  const box = el('section', { className: 'idx' });
  box.append(el('h2', {}, gid ? dot(gid) : null, title, el('small', { textContent: '(' + nodes.length + ')' })));
  const ul = el('ul');
  nodes.forEach(n => ul.append(el('li', {}, link(n.id,
    showGroup ? dot(n.group) : (n.order != null && !n.label.startsWith(n.order + ' ') ? el('span', { className: 'ord', textContent: n.order }) : null),
    el('span', { className: 'lbl', textContent: n.label }),
    el('small', { textContent: sub(n) || '' })))));
  box.append(ul);
  return box;
}

function renderNode(id) {
  const n = node(id), gr = groupOf(n);
  const crumbs = el('p', { className: 'crumbs' }, el('a', { textContent: G.title, href: '#' + G.key }), '›', dot(gr.id), el('span', { textContent: gr.label }));
  const parts = [crumbs];
  if (walk) {
    const prev = el('button', { className: 'btn', type: 'button', textContent: '‹ Previous', disabled: step === 0, onclick: () => walkStep(-1) });
    const next = el('button', { className: 'btn', type: 'button', textContent: 'Next ›', disabled: step === walk.nodes.length - 1, onclick: () => walkStep(1) });
    const stop = el('button', { className: 'btn', type: 'button', textContent: 'End walk', onclick: endWalk });
    parts.push(el('div', { className: 'walkbar' }, el('b', { textContent: 'Walk: ' + walk.label }), el('span', { textContent: `step ${step + 1} of ${walk.nodes.length}` }), prev, next, stop));
  }
  const meta = el('div', { className: 'meta' },
    el('span', { className: 'pill' }, dot(gr.id), gr.label),
    n.order != null ? el('span', { className: 'pill', textContent: 'step ' + n.order }) : null,
    statusPill(n.status),
    n.date ? el('span', { className: 'pill', textContent: fmtDate(n.date) }) : null);
  parts.push(el('h2', { className: 'node-title', textContent: n.label }), meta, el('p', { className: 'detail', textContent: n.detail || '' }));
  if (n.payload) parts.push(el('p', { className: 'label-row', textContent: 'Payload' }), el('pre', { className: 'payload', textContent: n.payload }));
  const src = sourceEl(n);
  if (src) parts.push(el('p', { className: 'label-row', textContent: n.links && n.links.length ? 'Code' : 'Source' }), src);
  const out = G.edges.filter(e => e.from === id), inc = G.edges.filter(e => e.to === id);
  parts.push(el('div', { className: 'conn' }, connList('Leads to', out, 'to'), connList('Comes from', inc, 'from')));
  // Previous / next inside the same group, in the group's order.
  const sibs = inGroup(n.group), i = sibs.findIndex(x => x.id === id);
  const nav = el('nav', { className: 'sibnav', ariaLabel: 'Previous and next in ' + gr.label });
  if (sibs[i - 1]) nav.append(link(sibs[i - 1].id, '‹ ' + sibs[i - 1].label));
  if (sibs[i + 1]) { const a = link(sibs[i + 1].id, sibs[i + 1].label + ' ›'); a.className = 'next'; nav.append(a); }
  if (nav.childElementCount) parts.push(el('p', { className: 'label-row', textContent: 'In ' + gr.label }), nav);
  reader.replaceChildren(...parts);
  reader.scrollTop = 0;
}

function connList(title, edges, end) {
  const box = el('div', {}, el('p', { className: 'label-row', textContent: title + ' (' + edges.length + ')' }));
  if (!edges.length) { box.append(el('p', { className: 'none', textContent: 'Nothing.' })); return box; }
  const ul = el('ul');
  edges.forEach(e => {
    const other = node(e[end]); if (!other) return;
    ul.append(el('li', {}, link(other.id, dot(other.group), el('span', {}, other.label, el('em', { textContent: e.label })))));
  });
  box.append(ul);
  return box;
}

// ---- Navigator graph
function elements() {
  const ids = new Set(G.nodes.map(n => n.id));
  return [
    ...G.nodes.map(n => ({ data: { ...n, gid: n.group } })),
    ...G.edges.filter(e => ids.has(e.from) && ids.has(e.to)).map((e, i) => ({ data: { id: 'e' + i, source: e.from, target: e.to, label: e.label } })),
  ];
}
function positions() {
  // Stage maps lay groups out as columns in order, each column in its group's order.
  if (G.layout !== 'stages') return null;
  const pos = {};
  // Without an `order`, a column runs by date, as a timeline.
  G.groups.forEach((gr, ci) => inGroup(gr.id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.date || '9').localeCompare(b.date || '9'))
    .forEach((n, ri) => { pos[n.id] = { x: ci * 240, y: (n.order ?? ri + 1) * 76 }; }));
  return pos;
}
function style() {
  const ink = css('--ink'), muted = css('--muted'), surf = css('--surface'), line = css('--line'), acc = css('--accent');
  return [
    { selector: 'node', style: {
      'background-color': n => css(groupColor[n.data('gid')] || '--g7'), 'border-width': 2, 'border-color': surf,
      'label': 'data(label)', 'color': ink, 'font-family': 'Instrument Sans, system-ui, sans-serif', 'font-size': 10,
      'text-wrap': 'ellipsis', 'text-max-width': 120, 'text-valign': 'bottom', 'text-margin-y': 4,
      'text-background-color': surf, 'text-background-opacity': 0.85, 'text-background-padding': 2, 'text-background-shape': 'roundrectangle',
      'min-zoomed-font-size': 7, 'width': 14, 'height': 14 } },
    { selector: 'node[status = "proposed"], node[status = "pending"], node[status = "planned"], node[status = "open"], node[status = "goal"]', style: {
      'background-opacity': 0.15, 'border-style': 'dashed', 'border-color': n => css(groupColor[n.data('gid')] || '--g7') } },
    { selector: 'edge', style: { 'width': 1.1, 'line-color': line, 'target-arrow-color': line, 'target-arrow-shape': 'triangle', 'arrow-scale': 0.7, 'curve-style': 'bezier',
      'label': '', 'font-size': 9, 'color': muted, 'font-family': 'JetBrains Mono, monospace', 'text-background-color': surf, 'text-background-opacity': 0.9, 'text-background-padding': 1, 'text-rotation': 'autorotate' } },
    { selector: '.faded', style: { 'opacity': parseFloat(css('--dim')) || 0.12 } },
    { selector: 'edge.hl', style: { 'line-color': acc, 'target-arrow-color': acc, 'width': 2, 'z-index': 9 } },
    { selector: 'node.hl', style: { 'width': 18, 'height': 18, 'font-weight': 600, 'z-index': 9, 'text-wrap': 'wrap' } },
    { selector: 'node.focus', style: { 'border-color': acc, 'border-width': 4, 'width': 26, 'height': 26, 'font-size': 12 } },
    { selector: '.hiddenGroup', style: { 'display': 'none' } },
  ];
}
function draw() {
  if (cy) cy.destroy();
  const pos = positions();
  cy = cytoscape({
    container: document.getElementById('cy'), elements: elements(), style: style(),
    layout: pos ? { name: 'preset', positions: n => pos[n.id()], fit: true, padding: 40 }
                : { name: 'cose', animate: false, nodeRepulsion: 9000, idealEdgeLength: 90, padding: 40, randomize: false, componentSpacing: 80 },
    minZoom: 0.15, maxZoom: 3, wheelSensitivity: 0.25,
  });
  cy.on('tap', 'node', e => { if (walk && !walk.nodes.includes(e.target.id())) { walk = null; markWalks(); } go(G.key, e.target.id()); });
  cy.on('tap', e => { if (e.target === cy) { walk = null; markWalks(); go(G.key, null); } });
}
function highlight(id) {
  if (!cy) return;
  cy.elements().removeClass('faded hl focus');
  if (walk) {
    const set = cy.collection(), ids = walk.nodes;
    ids.forEach((nid, i) => {
      set.merge(cy.getElementById(nid));
      if (i > 0) set.merge(cy.edges().filter(e => (e.source().id() === ids[i - 1] && e.target().id() === nid) || (e.target().id() === ids[i - 1] && e.source().id() === nid)));
    });
    cy.elements().not(set).addClass('faded'); set.addClass('hl');
  }
  if (!id) { if (!walk) cy.animate({ fit: { padding: 40 }, duration: 200 }); return; }
  const n = cy.getElementById(id); if (!n.length) return;
  const hood = n.closedNeighborhood().filter(x => !x.hasClass('hiddenGroup'));
  if (!walk) { cy.elements().not(hood).addClass('faded'); hood.addClass('hl'); }
  n.addClass('focus');
  // Show the node with its neighbours, not zoomed past readable or out to dots.
  const bb = hood.boundingBox(), w = cy.width() - 80, h = cy.height() - 80;
  const zoom = Math.min(1.3, Math.max(0.45, Math.min(w / Math.max(bb.w, 1), h / Math.max(bb.h, 1))));
  cy.animate({ zoom, center: { eles: walk ? n : hood }, duration: 220 });
}
function renderLegend() {
  const box = document.getElementById('legend'); box.replaceChildren();
  G.groups.forEach(gr => {
    const b = el('button', { type: 'button', className: 'chip', title: 'Show or hide ' + gr.label + ' in the graph' });
    b.setAttribute('aria-pressed', 'true');
    const i = el('i'); i.style.background = color(gr.id);
    b.append(i, gr.label);
    b.onclick = () => {
      const on = hidden.has(gr.id); on ? hidden.delete(gr.id) : hidden.add(gr.id);
      b.setAttribute('aria-pressed', String(on));
      cy.nodes().forEach(n => n.toggleClass('hiddenGroup', hidden.has(n.data('gid'))));
    };
    box.appendChild(b);
  });
}

// ---- Walks
function renderWalks() {
  const box = document.getElementById('walks'); box.replaceChildren();
  document.getElementById('walkcard').hidden = !(G.paths || []).length;
  (G.paths || []).forEach(p => {
    const b = el('button', { type: 'button', className: 'walk' }, el('b', { textContent: p.label }), el('span', { textContent: p.note || '' }));
    b.dataset.id = p.id; b.setAttribute('aria-pressed', 'false');
    b.onclick = () => startWalk(p.id);
    box.appendChild(b);
  });
}
function markWalks() { document.querySelectorAll('.walk').forEach(b => b.setAttribute('aria-pressed', String(!!walk && b.dataset.id === walk.id))); }
function startWalk(id) { walk = G.paths.find(p => p.id === id); step = 0; markWalks(); go(G.key, walk.nodes[0]); }
function walkStep(d) { const s = step + d; if (walk && s >= 0 && s < walk.nodes.length) { step = s; go(G.key, walk.nodes[s]); } }
function endWalk() { walk = null; markWalks(); select(current); }

// ---- Search
const search = document.getElementById('search'), results = document.getElementById('results');
let hits = [], hitIdx = 0;
function showResults() {
  const q = search.value.trim().toLowerCase();
  results.replaceChildren();
  if (!q) { results.hidden = true; search.setAttribute('aria-expanded', 'false'); return; }
  const score = n => n.label.toLowerCase().includes(q) ? 0 : (n.detail || '').toLowerCase().includes(q) || (n.source || '').toLowerCase().includes(q) ? 1 : 2;
  hits = G.nodes.filter(n => score(n) < 2).sort((a, b) => score(a) - score(b)).slice(0, 12);
  hitIdx = 0;
  if (!hits.length) results.append(el('li', { textContent: 'No node matches.' }));
  hits.forEach((n, i) => {
    const li = el('li', { id: 'hit-' + i }, dot(n.group), el('span', { textContent: n.label }), el('small', { textContent: groupOf(n).label }));
    li.setAttribute('role', 'option'); li.setAttribute('aria-selected', String(i === 0));
    li.onmousedown = e => { e.preventDefault(); pick(n.id); };
    results.append(li);
  });
  results.hidden = false; search.setAttribute('aria-expanded', 'true');
}
function pick(id) { search.value = ''; results.hidden = true; search.setAttribute('aria-expanded', 'false'); walk = null; markWalks(); go(G.key, id); reader.focus({ preventScroll: true }); }
search.addEventListener('input', showResults);
search.addEventListener('blur', () => setTimeout(() => { results.hidden = true; }, 100));
search.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!hits.length) return;
    hitIdx = (hitIdx + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    [...results.children].forEach((li, i) => li.setAttribute('aria-selected', String(i === hitIdx)));
  } else if (e.key === 'Enter' && hits[hitIdx]) { e.preventDefault(); pick(hits[hitIdx].id); }
  else if (e.key === 'Escape') { search.value = ''; showResults(); search.blur(); }
});

// ---- Keyboard: / search, ← → previous / next (in the walk, else in the group), Esc index
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); search.focus(); return; }
  if (e.key === 'Escape') { walk = null; markWalks(); go(G.key, null); return; }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && current) {
    const d = e.key === 'ArrowRight' ? 1 : -1;
    if (walk) { walkStep(d); return; }
    const sibs = inGroup(node(current).group), i = sibs.findIndex(x => x.id === current);
    if (sibs[i + d]) go(G.key, sibs[i + d].id);
  }
});

document.getElementById('fit').onclick = () => cy.fit(undefined, 40);
const restyle = () => cy && cy.style(style());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
addEventListener('hashchange', route);
route();
</script>
